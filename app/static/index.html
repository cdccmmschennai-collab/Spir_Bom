<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/theme.js"></script>
<link rel="icon" type="image/jpeg" href="/cdc-logo.jpg">
<title>SPIR BOM Tool</title>
<style>
  :root {
    --accent: #2563eb; --ink: #111; --gray-600: #666; --border: #ddd; --border-light: #eee;
    --page-bg: #fff; --card-bg: #fff;
  }
  :root[data-theme="dark"] {
    --ink: #f1f0f3; --gray-600: #b7b3bd; --border: #3a3540; --border-light: #302b36;
    --page-bg: #1c1a20; --card-bg: #2a2631;
  }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 820px; margin: 50px auto; padding: 0 20px;
    background: var(--page-bg); color: var(--ink);
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  h2 { font-size: 16px; margin-top: 48px; }
  p.sub { color: var(--gray-600); margin-top: 0; }
  #drop {
    border: 2px dashed var(--gray-600); border-radius: 12px; padding: 48px 20px;
    text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
  }
  #drop.hover { border-color: var(--accent); background: rgba(37,99,235,.06); }
  #drop input { display: none; }
  #status { margin-top: 20px; }
  .file-line { display: flex; align-items: center; gap: 10px; padding: 10px 14px;
               border: 1px solid var(--border); border-radius: 8px; margin-top: 8px; background: var(--card-bg); }
  .file-line a { margin-left: auto; text-decoration: none; color: var(--accent); font-weight: 600; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border);
             border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: #c00; margin-top: 16px; }
  .meta { font-size: 13px; color: var(--gray-600); margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border-light); }
  th { color: var(--gray-600); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  tr:hover { background: rgba(37,99,235,.05); }
  td a { color: var(--accent); text-decoration: none; margin-right: 10px; font-weight: 600; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.ok { background: #dcfce7; color: #166534; }
  .badge.error { background: #fee2e2; color: #991b1b; }
  #searchBox { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; width: 220px;
               font-size: 14px; background: var(--card-bg); color: var(--ink); }
  #topbar { display: flex; justify-content: space-between; align-items: baseline; }
  #userInfo { font-size: 13px; color: var(--gray-600); }
  #userInfo a { color: var(--accent); text-decoration: none; margin-left: 8px; font-weight: 600; cursor: pointer; }
  nav { margin: 4px 0 28px; font-size: 13px; }
  nav a { color: var(--accent); text-decoration: none; font-weight: 600; margin-right: 16px; }
  nav a.current { color: var(--ink); text-decoration: none; cursor: default; }
</style>
</head>
<body>
  <div id="topbar">
    <h1>SPIR&#8209;BOM TOOL</h1>
    <div id="userInfo"></div>
  </div>
  <nav>
    <a href="/index.html" class="current">Full tool</a>
    <a href="/extraction.html">Extraction</a>
    <a href="/batch-extraction.html">Batch Extraction</a>
    <a href="/extraction-history.html">History</a>
    <a href="/parts-master.html">Parts Master</a>
  </nav>
  <p class="sub">Upload a SPIR (.xlsx / .xlsm / .xlsb / .xltx / .xls). You'll get an Extraction file and an SAP OUTPUT file.</p>

  <div id="drop">
    <div id="dropLabel">Drag a SPIR file here, or click to choose one</div>
    <input type="file" id="fileInput" accept=".xlsx,.xlsm,.xlsb,.xltx,.xls">
  </div>

  <div id="status"></div>

  <h2>History <input id="searchBox" placeholder="Filter by SPIR number or filename..."></h2>
  <table id="historyTable">
    <thead><tr><th>When</th><th>SPIR No.</th><th>Sheets / Tags</th><th>Status</th><th>Files</th></tr></thead>
    <tbody id="historyBody"><tr><td colspan="5">Loading...</td></tr></tbody>
  </table>

  <script>
    const drop = document.getElementById('drop');
    const input = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const searchBox = document.getElementById('searchBox');

    drop.addEventListener('click', () => input.click());
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('hover'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('hover'));
    drop.addEventListener('drop', e => {
      e.preventDefault(); drop.classList.remove('hover');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    input.addEventListener('change', () => { if (input.files.length) handleFile(input.files[0]); });
    searchBox.addEventListener('input', () => loadHistory(searchBox.value));

    function goToLogin() { window.location.href = '/login.html'; }

    async function handleFile(file) {
      status.innerHTML = `<div><span class="spinner"></span> Processing ${file.name}...</div>`;
      const form = new FormData();
      form.append('file', file);
      try {
        const res = await fetch('/api/process', { method: 'POST', body: form });
        if (res.status === 401) return goToLogin();
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Processing failed');
        render(data);
        loadHistory();
      } catch (err) {
        status.innerHTML = `<div class="error">${err.message}</div>`;
      }
    }

    async function loadUser() {
      const res = await fetch('/api/me');
      if (res.status === 401) return goToLogin();
      const data = await res.json();
      document.getElementById('userInfo').innerHTML =
        `Signed in as <b>${data.username}</b><a id="logoutLink">Logout</a>`;
      document.getElementById('logoutLink').addEventListener('click', async () => {
        await fetch('/api/logout', { method: 'POST' });
        goToLogin();
      });
    }

    function render(data) {
      const dl = (fname, label) =>
        `<div class="file-line">📄 ${label}<a href="/api/download/${data.job_id}/${fname}" download>Download</a></div>`;
      status.innerHTML = `
        <div class="meta">SPIR: <b>${data.spir_no}</b> &middot; Sheets: ${data.sheets.join(', ')} &middot; Tags: ${data.tags.length}</div>
        ${dl(data.extraction_file, 'Extraction file')}
        ${dl(data.output_file, 'OUTPUT (SAP) file')}
        ${dl(data.zip_file, 'Both, zipped')}
      `;
    }

    async function loadHistory(search) {
      const url = '/api/history' + (search ? `?search=${encodeURIComponent(search)}` : '');
      const res = await fetch(url);
      if (res.status === 401) return goToLogin();
      const rows = await res.json();
      const body = document.getElementById('historyBody');
      if (!rows.length) {
        body.innerHTML = '<tr><td colspan="5">No files processed yet.</td></tr>';
        return;
      }
      body.innerHTML = rows.map(r => {
        const when = new Date(r.created_at + 'Z').toLocaleString();
        const badge = r.status === 'ok'
          ? '<span class="badge ok">ok</span>'
          : '<span class="badge error">error</span>';
        const files = r.status === 'ok'
          ? `<a href="/api/download/${r.job_id}/${r.extraction_file}">Extraction</a>` +
            `<a href="/api/download/${r.job_id}/${r.output_file}">OUTPUT</a>` +
            `<a href="/api/download/${r.job_id}/${r.zip_file}">Zip</a>`
          : '&mdash;';
        return `<tr>
          <td>${when}</td>
          <td>${r.spir_no || r.original_filename}</td>
          <td>${r.sheets.length} sheet(s), ${r.tags.length} tag(s)</td>
          <td>${badge}</td>
          <td>${files}</td>
        </tr>`;
      }).join('');
    }

    loadUser();
    loadHistory();
  </script>
</body>
</html>
