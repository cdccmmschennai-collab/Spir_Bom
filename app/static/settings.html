<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/theme.js"></script>
<link rel="icon" type="image/jpeg" href="/cdc-logo.jpg">
<title>Settings &middot; SPIR-BOM Tool</title>
<style>
  :root {
    --purple: #8a4a90;
    --purple-dark: #753f7a;
    --purple-light: #f3edf4;
    --red: #dc2626;
    --green: #16a34a;
    --ink: #1f2430;
    --gray-600: #6b7280;
    --gray-400: #9ca3af;
    --border: #e3e7ef;
    --page-bg: #f7f8fa;
    --card-bg: #ffffff;
  }
  :root[data-theme="dark"] {
    --ink: #f1f0f3; --gray-600: #b7b3bd; --gray-400: #8b8794;
    --border: #3a3540; --page-bg: #1c1a20; --card-bg: #2a2631;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Inter", Segoe UI, Roboto, sans-serif;
    background: var(--page-bg); color: var(--ink);
    display: flex; flex-direction: column; min-height: 100vh;
  }
  a { color: inherit; }
  svg.icon { width: 18px; height: 18px; flex: none; }

  /* ---------- top header (spans sidebar + main content) ---------- */
  #topHeader {
    height: 56px; flex: none; background: var(--card-bg); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
  }
  #topHeaderBrand { display: flex; align-items: center; gap: 10px; }
  #topHeaderLogo {
    width: 32px; height: 32px; border-radius: 8px; background: #fff;
    display: flex; align-items: center; justify-content: center; flex: none;
    overflow: hidden; border: 1px solid var(--border);
  }
  #topHeaderLogo img { width: 100%; height: 100%; object-fit: contain; }
  #topHeaderBrand span { font-size: 15px; font-weight: 700; letter-spacing: .2px; }

  /* ---------- app shell ---------- */
  #shell { display: flex; flex: 1; min-height: 0; }

  /* ---------- sidebar ---------- */
  #sidebar {
    width: 250px; flex: none; background: var(--card-bg); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 20px 14px;
  }

  nav#sideNav { display: flex; flex-direction: column; gap: 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px;
    border-radius: 10px; font-size: 13.5px; font-weight: 500; color: var(--gray-600);
    text-decoration: none; cursor: pointer; position: relative;
  }
  .nav-item:hover:not(.disabled) { background: rgba(138,74,144,.08); }
  .nav-item.active { background: var(--purple-light); color: var(--purple-dark); font-weight: 600; }
  .nav-item.active svg { color: var(--purple-dark); }
  .nav-item.disabled { color: var(--gray-400); cursor: not-allowed; }
  .nav-item svg { color: var(--gray-400); }
  .nav-item.active svg, .nav-item:not(.disabled):hover svg { color: var(--purple-dark); }

  /* ---------- main column ---------- */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  #searchWrap {
    display: flex; align-items: center; gap: 8px; background: var(--page-bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; height: 32px;
    width: 260px; max-width: 40vw;
  }
  #searchWrap svg { color: var(--gray-400); }
  #searchWrap input {
    border: none; background: transparent; outline: none; font-size: 13.5px;
    width: 100%; color: var(--ink);
  }
  #searchWrap input::placeholder { color: var(--gray-400); }

  #avatarWrap { position: relative; }
  #avatarBtn {
    width: 32px; height: 32px; border-radius: 50%; background: var(--purple); color: #fff;
    border: none; font-size: 12px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; letter-spacing: .3px;
  }
  #avatarMenu {
    display: none; position: absolute; right: 0; top: 42px; background: var(--card-bg, #fff);
    border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px rgba(20,20,40,.08);
    min-width: 190px; padding: 12px; z-index: 10;
  }
  #avatarMenu.open { display: block; }
  #avatarMenu .who { font-size: 12px; color: var(--gray-600); margin-bottom: 10px; }
  #avatarMenu .who b { color: var(--ink); }
  #logoutBtn {
    width: 100%; text-align: left; background: none; border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; font-weight: 600;
    color: var(--ink); cursor: pointer;
  }
  #logoutBtn:hover { background: var(--page-bg); }

  /* ---------- content ---------- */
  #content { flex: 1; padding: 40px 24px 60px; }
  #settingsCol { max-width: 540px; width: 100%; margin: 0 auto; }
  #settingsCol > h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; text-align: center; }
  #settingsCol > p.sub { font-size: 13.5px; color: var(--gray-600); margin: 0 0 28px; text-align: center; }

  .card {
    background: var(--card-bg, #fff); border: 1px solid var(--border); border-radius: 14px;
    padding: 22px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(20,20,40,.03);
  }
  .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .card-header .ic {
    width: 30px; height: 30px; border-radius: 9px; background: var(--purple-light);
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .card-header .ic svg { width: 16px; height: 16px; color: var(--purple); }
  .card-header h2 { font-size: 14.5px; font-weight: 700; margin: 0; }

  /* profile card */
  #profileTop { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  #avatarLarge {
    width: 58px; height: 58px; border-radius: 50%; background: var(--purple); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 700;
    position: relative; flex: none;
  }
  #avatarEditDot {
    position: absolute; right: -2px; bottom: -2px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--card-bg, #fff); border: 1px solid var(--border); display: flex;
    align-items: center; justify-content: center; color: var(--gray-600); cursor: not-allowed;
  }
  #avatarEditDot svg { width: 11px; height: 11px; }
  #profileName { font-size: 15.5px; font-weight: 700; margin: 0 0 4px; }
  .user-badge {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .04em;
    color: var(--purple-dark); background: var(--purple-light); padding: 2px 8px; border-radius: 999px;
  }
  #profileFields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
  .field-label {
    font-size: 10.5px; font-weight: 700; letter-spacing: .05em; color: var(--gray-400);
    text-transform: uppercase; margin-bottom: 4px;
  }
  .field-value { font-size: 13.5px; font-weight: 600; word-break: break-word; }
  #profileStats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-box {
    background: var(--page-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px;
  }
  .stat-box .n { font-size: 18px; font-weight: 700; }
  .stat-box .l { font-size: 11px; color: var(--gray-600); margin-top: 2px; }

  /* password card */
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .05em;
    color: var(--gray-400); text-transform: uppercase; margin-bottom: 6px;
  }
  .pw-wrap { position: relative; }
  .pw-wrap input {
    width: 100%; box-sizing: border-box; padding: 9px 38px 9px 11px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 13.5px; background: var(--page-bg); color: var(--ink);
  }
  .pw-wrap button {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none;
    border: none; cursor: pointer; color: var(--gray-400); padding: 4px; display: flex;
  }
  .pw-wrap button svg { width: 16px; height: 16px; }
  .btn-primary {
    width: 100%; background: var(--purple); color: #fff; border: none; border-radius: 9px;
    padding: 11px; font-size: 13.5px; font-weight: 700; cursor: pointer; margin-top: 4px;
  }
  .btn-primary:hover { background: var(--purple-dark); }
  .btn-primary:disabled { opacity: .55; cursor: not-allowed; }
  .form-msg { font-size: 12.5px; margin-top: 10px; }
  .form-msg.error { color: var(--red); }
  .form-msg.success { color: var(--green); }

  /* preferences card */
  .pref-row { display: flex; align-items: center; justify-content: space-between; }
  .pref-row .t { font-size: 13.5px; font-weight: 600; }
  .pref-row .d { font-size: 12px; color: var(--gray-600); margin-top: 2px; }
  .switch { position: relative; width: 40px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0; background: var(--border); border-radius: 999px;
    cursor: pointer; transition: background .15s;
  }
  .switch .track::before {
    content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: transform .15s;
  }
  .switch input:checked + .track { background: var(--purple); }
  .switch input:checked + .track::before { transform: translateX(18px); }

  @media (max-width: 900px) {
    #sidebar { width: 68px; padding: 20px 10px; }
    .nav-item span.label { display: none; }
    .nav-item { justify-content: center; padding: 0; }
    #searchWrap { width: 160px; }
  }
  @media (max-width: 560px) {
    #searchWrap { display: none; }
    #content { padding: 24px 16px 40px; }
    #profileFields { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <header id="topHeader">
    <div id="topHeaderBrand">
      <div id="topHeaderLogo">
        <img src="/cdc-logo.jpg" alt="CDC">
      </div>
      <h3>SPIR BOM TOOL</h3>
    </div>
    <div id="avatarWrap">
      <button id="avatarBtn" type="button">&hellip;</button>
      <div id="avatarMenu">
        <div class="who">Signed in as <b id="whoName">&hellip;</b></div>
        <button id="logoutBtn" type="button">Log out</button>
      </div>
    </div>
  </header>
  <div id="shell">
    <aside id="sidebar">
      <nav id="sideNav">
        <a href="/extraction.html" class="nav-item">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"/></svg>
          <span class="label">Extraction</span>
        </a>
        <a href="/batch-extraction.html" class="nav-item">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18 8 4A2 2 0 0 1 22 7.94v8.12a2 2 0 0 1-1.17 1.76l-8 4a2 2 0 0 1-1.66 0l-8-4A2 2 0 0 1 2 16.06V7.94a2 2 0 0 1 1.17-1.76l8-4a2 2 0 0 1 1.66 0Z"/><path d="M2.32 6.16 12 11l9.68-4.84"/><path d="M12 22.76V11"/></svg>
          <span class="label">Batch Extraction</span>
        </a>
        <a href="/extraction-history.html" class="nav-item">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
          <span class="label">History</span>
        </a>
        <a href="/parts-master.html" class="nav-item">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span class="label">Parts Master</span>
        </a>
        <a href="/settings.html" class="nav-item active">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
          <span class="label">Settings</span>
        </a>
      </nav>
    </aside>

    <div id="main">
      <div id="content">
        <div id="settingsCol">

          <!-- Profile -->
          <div class="card">
            <div class="card-header">
              <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg></div>
              <h2>Profile</h2>
            </div>

            <div id="profileTop">
              <div id="avatarLarge">
                <span id="avatarLargeText">&hellip;</span>
                <div id="avatarEditDot" title="Not available">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
                </div>
              </div>
              <div>
                <div id="profileName">&hellip;</div>
                <span class="user-badge">USER</span>
              </div>
            </div>

            <div id="profileFields">
              <div>
                <div class="field-label">Username</div>
                <div class="field-value" id="fieldUsername">&hellip;</div>
              </div>
              <div>
                <div class="field-label">Full Name</div>
                <div class="field-value" id="fieldFullName">&hellip;</div>
              </div>
            </div>

            <div id="profileStats">
              <div class="stat-box">
                <div class="n" id="statExtractions">&hellip;</div>
                <div class="l">Extractions</div>
              </div>
              <div class="stat-box">
                <div class="n" id="statLastLogin" style="font-size:13px;">&hellip;</div>
                <div class="l">Last login</div>
              </div>
            </div>
          </div>

          <!-- Change Password -->
          <div class="card">
            <div class="card-header">
              <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
              <h2>Change Password</h2>
            </div>

            <form id="pwForm">
              <div class="field">
                <label for="currentPassword">Current Password</label>
                <div class="pw-wrap">
                  <input type="password" id="currentPassword" autocomplete="current-password" required>
                  <button type="button" class="pw-toggle" data-target="currentPassword">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                </div>
              </div>
              <div class="field">
                <label for="newPassword">New Password</label>
                <div class="pw-wrap">
                  <input type="password" id="newPassword" autocomplete="new-password" minlength="6" required>
                  <button type="button" class="pw-toggle" data-target="newPassword">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                </div>
              </div>
              <div class="field">
                <label for="confirmPassword">Confirm New Password</label>
                <div class="pw-wrap">
                  <input type="password" id="confirmPassword" autocomplete="new-password" minlength="6" required>
                  <button type="button" class="pw-toggle" data-target="confirmPassword">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                </div>
              </div>
              <button type="submit" class="btn-primary" id="pwSubmit">Update Password</button>
              <div class="form-msg" id="pwMsg"></div>
            </form>
          </div>

          <!-- Preferences -->
          <div class="card">
            <div class="card-header">
              <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></div>
              <h2>Preferences</h2>
            </div>

            <div class="pref-row">
              <div>
                <div class="t">Appearance</div>
                <div class="d">Light mode</div>
              </div>
              <label class="switch">
                <input type="checkbox" id="themeToggle">
                <span class="track"></span>
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function goToLogin() { window.location.href = '/login.html'; }

    function initials(name) {
      const parts = String(name || '').split(/[^a-zA-Z0-9]+/).filter(Boolean);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return '?';
    }

    async function loadUser() {
      const res = await fetch('/api/me');
      if (res.status === 401) return goToLogin();
      const data = await res.json();
      document.getElementById('avatarBtn').textContent = initials(data.username);
      document.getElementById('whoName').textContent = data.username;
    }

    async function loadProfile() {
      const res = await fetch('/api/profile');
      if (res.status === 401) return goToLogin();
      const p = await res.json();
      document.getElementById('avatarLargeText').textContent = initials(p.username);
      document.getElementById('profileName').textContent = p.full_name || p.username;
      document.getElementById('fieldUsername').textContent = p.username;
      document.getElementById('fieldFullName').textContent = p.full_name || '—';
      document.getElementById('statExtractions').textContent = p.extractions_count;
      document.getElementById('statLastLogin').textContent =
        p.last_login ? new Date(p.last_login + 'Z').toLocaleString() : '—';
    }

    const avatarBtn = document.getElementById('avatarBtn');
    const avatarMenu = document.getElementById('avatarMenu');
    avatarBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      avatarMenu.classList.toggle('open');
    });
    document.addEventListener('click', () => avatarMenu.classList.remove('open'));

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      goToLogin();
    });

    // password visibility toggles
    document.querySelectorAll('.pw-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.getAttribute('data-target'));
        input.type = input.type === 'password' ? 'text' : 'password';
      });
    });

    // change password
    const pwForm = document.getElementById('pwForm');
    const pwMsg = document.getElementById('pwMsg');
    const pwSubmit = document.getElementById('pwSubmit');
    pwForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      pwMsg.textContent = '';
      pwMsg.className = 'form-msg';
      const current = document.getElementById('currentPassword').value;
      const next = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      if (next !== confirm) {
        pwMsg.textContent = 'New password and confirmation do not match.';
        pwMsg.className = 'form-msg error';
        return;
      }
      if (next.length < 6) {
        pwMsg.textContent = 'New password must be at least 6 characters.';
        pwMsg.className = 'form-msg error';
        return;
      }
      pwSubmit.disabled = true;
      try {
        const res = await fetch('/api/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ current_password: current, new_password: next }),
        });
        if (res.status === 401) return goToLogin();
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || 'Could not update password.');
        pwMsg.textContent = 'Password updated.';
        pwMsg.className = 'form-msg success';
        pwForm.reset();
      } catch (err) {
        pwMsg.textContent = err.message;
        pwMsg.className = 'form-msg error';
      } finally {
        pwSubmit.disabled = false;
      }
    });

    // theme toggle -- uses the shared bomToolTheme API (theme.js) so the
    // preference applies to every page and survives navigation/sessions.
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.checked = bomToolTheme.get() === 'dark';
    themeToggle.addEventListener('change', () => {
      bomToolTheme.set(themeToggle.checked ? 'dark' : 'light');
    });

    loadUser();
    loadProfile();
  </script>
</body>
</html>
