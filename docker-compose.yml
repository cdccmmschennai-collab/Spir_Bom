# BOM Tool + Caddy (automatic HTTPS). Setup and day-to-day commands: DEPLOY.md
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      # Database, uploaded SPIRs, generated files and logs live on the host
      # disk, so rebuilding or updating the container never loses them.
      - ./data:/app/data
    # No ports published: only Caddy (below) can reach the app.
    expose:
      - "8001"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env (see .env.example)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # HTTPS certificates
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
